services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: longhand
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: longhand
    volumes:
      - longhand_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longhand -d longhand"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    image: longhand-app:latest
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["node", "scripts/migrate.mjs"]
    depends_on:
      db:
        condition: service_healthy

  app:
    image: longhand-app:latest
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_URL: ${AUTH_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      AUTH_RESEND_KEY: ${AUTH_RESEND_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      DO_AUTH_TOKEN: ${DO_AUTH_TOKEN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: longhand
      POSTGRES_DB: longhand
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /backups
        while true; do
          now=$$(date +%H:%M)
          if [ "$$now" = "03:00" ]; then
            stamp=$$(date +%Y%m%d-%H%M%S)
            dest="/backups/longhand-$$stamp.sql.gz"
            echo "Backing up to $$dest"
            pg_dump -h db -U "$$POSTGRES_USER" "$$POSTGRES_DB" | gzip > "$$dest"
            ls -1t /backups/longhand-*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm --
            sleep 60
          fi
          sleep 30
        done

volumes:
  longhand_pg_prod:
  caddy_data:
  caddy_config:
